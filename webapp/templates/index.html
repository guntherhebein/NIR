<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Protokoll-Archiv</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container-fluid py-4">

  <h1 class="mb-4">📄 Protokoll-Archiv</h1>

  <form id="searchForm" class="card card-body mb-4 shadow-sm">
    <div class="row g-3">
      <div class="col-md-2">
        <label class="form-label">Datum von</label>
        <input type="date" class="form-control" name="date_from">
      </div>
      <div class="col-md-2">
        <label class="form-label">Datum bis</label>
        <input type="date" class="form-control" name="date_to">
      </div>
      <div class="col-md-2">
        <label class="form-label">Gerätenummer</label>
        <input type="text" class="form-control" name="device" placeholder="z.B. 2130000670">
      </div>
      <div class="col-md-2">
        <label class="form-label">Messungsnummer</label>
        <input type="text" class="form-control" name="seq" placeholder="z.B. 61">
      </div>
      <div class="col-md-4">
        <label class="form-label">Name / Code / Stoffklasse (Teilstring)</label>
        <input type="text" class="form-control" name="name" placeholder="z.B. Triglyceride">
      </div>
    </div>
    <div class="row g-3 mt-1">
      <div class="col-md-2">
        <label class="form-label">Benutzer</label>
        <input type="text" class="form-control" name="benutzer" placeholder="z.B. hebein">
      </div>
      <div class="col-md-2">
        <label class="form-label">Apotheke</label>
        <input type="text" class="form-control" name="apotheke" placeholder="z.B. kornblumen apo">
      </div>
      <div class="col-md-2">
        <label class="form-label">Prüfergebnis</label>
        <select class="form-select" name="pruefergebnis">
          <option value="">Alle</option>
          <option value="stimmt überein">stimmt überein</option>
          <option value="stimmt nicht">stimmt nicht überein</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Validierung</label>
        <select class="form-select" name="validierung">
          <option value="">Alle</option>
          <option value="valide">valide</option>
          <option value="invalide">invalide</option>
        </select>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Suchen</button>
      </div>
    </div>
    <div class="mt-2">
      <button type="button" id="resetBtn" class="btn btn-link p-0">Filter zurücksetzen</button>
      <span id="resultCount" class="text-muted ms-3"></span>
    </div>
  </form>

  <div id="results" class="row g-3"></div>
</div>

<!-- PDF Viewer Modal -->
<div class="modal fade" id="pdfModal" tabindex="-1">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0" id="pdfModalTitle">Protokoll</h5>
          <small class="text-muted" id="pdfModalSubtitle"></small>
        </div>
        <div class="ms-auto d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="printBtn">🖨️ Drucken</button>
          <a class="btn btn-outline-secondary btn-sm" id="downloadLink" href="#" target="_blank">⬇️ Download</a>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
      </div>
      <div class="modal-body p-0">
        <iframe id="pdfFrame" src="" class="w-100 h-100" style="border:0;"></iframe>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
